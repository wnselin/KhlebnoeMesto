<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="Прейскурант сайта">
  <defs>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: bold; }
    .mono  { font-family: 'Courier New', monospace; }
    .sans  { font-family: Verdana, Arial, sans-serif; }
  </style>

  <rect width="800" height="640" fill="#e9dcc2"/>
  <rect x="14" y="14" width="772" height="612" fill="#f1e7d3"/>
  <rect x="14" y="14" width="772" height="612" fill="#f1e7d3" filter="url(#grain2)" opacity="0.05"/>
  <rect x="14" y="14" width="772" height="612" fill="none" stroke="#26180e" stroke-width="1.5" opacity="0.5"/>

  <!-- заголовок секции -->
  <text x="40" y="66" class="mono" font-size="12" letter-spacing="3" fill="#bc3b1d">( 03 ) — ПРЕЙСКУРАНТЪ</text>
  <text x="40" y="112" class="serif" font-size="29" fill="#26180e">Цены — как в старом городе:</text>
  <text x="40" y="148" class="serif" font-size="29" fill="#26180e"><tspan font-style="italic" font-weight="normal" fill="#bc3b1d">без сюрпризов.</tspan></text>

  <!-- табы -->
  <text x="40" y="192" class="mono" font-size="12" letter-spacing="2" fill="#bc3b1d">ВСЁ</text>
  <rect x="40" y="198" width="30" height="2" fill="#bc3b1d"/>
  <text x="96" y="192" class="mono" font-size="12" letter-spacing="2" fill="#6a5645">ХЛЕБ</text>
  <text x="160" y="192" class="mono" font-size="12" letter-spacing="2" fill="#6a5645">ВЫПЕЧКА</text>
  <text x="252" y="192" class="mono" font-size="12" letter-spacing="2" fill="#6a5645">СЛАДОСТИ</text>
  <line x1="40" y1="200" x2="760" y2="200" stroke="#26180e" stroke-width="1" opacity="0.4"/>

  <!-- строка 01 -->
  <line x1="40" y1="228" x2="760" y2="228" stroke="#26180e" stroke-width="1" opacity="0.4"/>
  <text x="46" y="262" class="mono" font-size="11" fill="#bc3b1d">01</text>
  <text x="92" y="264" class="serif" font-size="21" fill="#26180e">Бородинский хлеб</text>
  <text x="92" y="284" class="sans" font-size="12" fill="#6a5645">ржаная мука, кориандр, тмин</text>
  <line x1="360" y1="262" x2="560" y2="262" stroke="#26180e" stroke-width="2" stroke-dasharray="2 5" opacity="0.4"/>
  <text x="574" y="266" class="mono" font-size="14" fill="#26180e">120 ₽</text>
  <rect x="664" y="240" width="90" height="30" fill="none" stroke="#26180e" stroke-width="1" opacity="0.4"/>
  <text x="709" y="260" class="mono" font-size="10" letter-spacing="1" fill="#26180e" text-anchor="middle">В ЗАКАЗ</text>

  <!-- строка 02 -->
  <line x1="40" y1="294" x2="760" y2="294" stroke="#26180e" stroke-width="1" opacity="0.4"/>
  <text x="46" y="328" class="mono" font-size="11" fill="#bc3b1d">02</text>
  <text x="92" y="330" class="serif" font-size="21" fill="#26180e">Багет французский</text>
  <text x="92" y="350" class="sans" font-size="12" fill="#6a5645">длинная холодная расстойка</text>
  <line x1="360" y1="328" x2="560" y2="328" stroke="#26180e" stroke-width="2" stroke-dasharray="2 5" opacity="0.4"/>
  <text x="574" y="332" class="mono" font-size="14" fill="#26180e">150 ₽</text>
  <rect x="664" y="306" width="90" height="30" fill="none" stroke="#26180e" stroke-width="1" opacity="0.4"/>
  <text x="709" y="326" class="mono" font-size="10" letter-spacing="1" fill="#26180e" text-anchor="middle">В ЗАКАЗ</text>

  <!-- строка 03 — инвертированная (hover) -->
  <rect x="40" y="360" width="720" height="66" fill="#26180e"/>
  <text x="46" y="394" class="mono" font-size="11" fill="#bc3b1d">03</text>
  <text x="92" y="396" class="serif" font-size="21" fill="#f1e7d3">Круассан классик</text>
  <text x="92" y="416" class="sans" font-size="12" fill="#cbb9a3">72 слоя, французское масло</text>
  <line x1="360" y1="394" x2="540" y2="394" stroke="#f1e7d3" stroke-width="2" stroke-dasharray="2 5" opacity="0.4"/>
  <text x="554" y="398" class="mono" font-size="14" fill="#f1e7d3">180 ₽</text>
  <rect x="664" y="372" width="90" height="30" fill="none" stroke="#f1e7d3" stroke-width="1" opacity="0.5"/>
  <text x="709" y="392" class="mono" font-size="10" letter-spacing="1" fill="#f1e7d3" text-anchor="middle">В ЗАКАЗ</text>

  <!-- строка 04 -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#26180e" stroke-width="1" opacity="0.4"/>
  <text x="46" y="460" class="mono" font-size="11" fill="#bc3b1d">04</text>
  <text x="92" y="462" class="serif" font-size="21" fill="#26180e">Медовик</text>
  <text x="92" y="482" class="sans" font-size="12" fill="#6a5645">восемь коржей, сметанный крем</text>
  <line x1="360" y1="460" x2="560" y2="460" stroke="#26180e" stroke-width="2" stroke-dasharray="2 5" opacity="0.4"/>
  <text x="574" y="464" class="mono" font-size="14" fill="#26180e">320 ₽</text>
  <rect x="664" y="438" width="90" height="30" fill="none" stroke="#26180e" stroke-width="1" opacity="0.4"/>
  <text x="709" y="458" class="mono" font-size="10" letter-spacing="1" fill="#26180e" text-anchor="middle">В ЗАКАЗ</text>
  <line x1="40" y1="492" x2="760" y2="492" stroke="#26180e" stroke-width="1" opacity="0.4"/>

  <text x="760" y="530" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="end">выпекаем малыми партиями —</text>
  <text x="760" y="550" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="end">к вечеру кое-что кончается</text>

  <!-- карточка-справка (следует за курсором) -->
  <g transform="translate(585,255) rotate(-4)">
    <rect x="10" y="12" width="150" height="175" fill="#26180e" opacity="0.14"/>
    <rect width="150" height="175" fill="#f7efdd" stroke="#26180e" stroke-width="1.5"/>
    <text x="75" y="98" class="serif" font-size="66" fill="#bc3b1d" text-anchor="middle">К</text>
    <line x1="60" y1="112" x2="90" y2="112" stroke="#26180e" stroke-width="1" opacity="0.4"/>
    <text x="75" y="134" class="mono" font-size="9" letter-spacing="1" fill="#26180e" text-anchor="middle">КРУАССАН КЛАССИК</text>
    <text x="75" y="152" class="mono" font-size="10" fill="#6a5645" text-anchor="middle">180 ₽</text>
  </g>

  <!-- печать «ПРИНЯТО» -->
  <g transform="translate(688,568) rotate(-12)">
    <rect x="-56" y="-36" width="112" height="64" fill="#f7efdd" opacity="0.75"/>
    <rect x="-56" y="-36" width="112" height="64" fill="none" stroke="#bc3b1d" stroke-width="2.5"/>
    <rect x="-49" y="-29" width="98" height="50" fill="none" stroke="#bc3b1d" stroke-width="1"/>
    <text y="-4" class="mono" font-size="14" letter-spacing="3" fill="#bc3b1d" text-anchor="middle">ПРИНЯТО</text>
    <text y="16" class="mono" font-size="9" letter-spacing="1" fill="#6a5645" text-anchor="middle">спасибо, Иван</text>
  </g>
</svg>
