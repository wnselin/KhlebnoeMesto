<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="280" viewBox="0 0 1400 280" role="img" aria-label="Палитра сайта">
  <defs>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', monospace; }
  </style>

  <rect width="1400" height="280" fill="#f1e7d3"/>
  <rect width="1400" height="280" filter="url(#grain3)" opacity="0.05"/>

  <text x="60" y="62" class="mono" font-size="13" letter-spacing="4" fill="#6a5645">ПАЛИТРА — DESIGN TOKENS</text>
  <text x="1340" y="62" class="mono" font-size="13" letter-spacing="4" fill="#bc3b1d" text-anchor="end">( ПЕЧАТЬ НА БУМАГЕ )</text>

  <!-- бумага -->
  <rect x="60" y="96" width="200" height="110" fill="#f1e7d3" stroke="#26180e" stroke-width="1" opacity="1"/>
  <rect x="60" y="96" width="200" height="110" fill="none" stroke="#26180e" stroke-width="1" opacity="0.5"/>
  <text x="160" y="236" class="mono" font-size="13" fill="#26180e" text-anchor="middle">#f1e7d3</text>
  <text x="160" y="258" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="middle">бумага · paper</text>

  <!-- бумага тёмная -->
  <rect x="286" y="96" width="200" height="110" fill="#e9dcc2" stroke="#26180e" stroke-width="1" opacity="1"/>
  <rect x="286" y="96" width="200" height="110" fill="none" stroke="#26180e" stroke-width="1" opacity="0.5"/>
  <text x="386" y="236" class="mono" font-size="13" fill="#26180e" text-anchor="middle">#e9dcc2</text>
  <text x="386" y="258" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="middle">бумага · alt</text>

  <!-- чернила -->
  <rect x="512" y="96" width="200" height="110" fill="#26180e"/>
  <text x="612" y="236" class="mono" font-size="13" fill="#26180e" text-anchor="middle">#26180e</text>
  <text x="612" y="258" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="middle">чернила · ink</text>

  <!-- мягкие чернила -->
  <rect x="738" y="96" width="200" height="110" fill="#6a5645"/>
  <text x="838" y="236" class="mono" font-size="13" fill="#26180e" text-anchor="middle">#6a5645</text>
  <text x="838" y="258" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="middle">мягкие чернила</text>

  <!-- сургуч -->
  <rect x="964" y="96" width="200" height="110" fill="#bc3b1d"/>
  <text x="1064" y="236" class="mono" font-size="13" fill="#26180e" text-anchor="middle">#bc3b1d</text>
  <text x="1064" y="258" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="middle">сургуч · seal</text>

  <!-- золото -->
  <rect x="1190" y="96" width="200" height="110" fill="#d9a441"/>
  <text x="1290" y="236" class="mono" font-size="13" fill="#26180e" text-anchor="middle">#d9a441</text>
  <text x="1290" y="258" class="mono" font-size="11" letter-spacing="1" fill="#6a5645" text-anchor="middle">золото · gold</text>
</svg>
